<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, sans-serif">
    <defs>
        <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fdfcfb"/>
            <stop offset="1" stop-color="#f7f2ff"/>
        </linearGradient>
        <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#7c52e6"/>
            <stop offset="1" stop-color="#4f29a3"/>
        </linearGradient>
        <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#00b7c3"/>
            <stop offset="1" stop-color="#0078d4"/>
        </linearGradient>
        <linearGradient id="bronzeGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#e9d3b8"/>
            <stop offset="1" stop-color="#d9b48a"/>
        </linearGradient>
        <linearGradient id="silverGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#eef1f4"/>
            <stop offset="1" stop-color="#dbe1e8"/>
        </linearGradient>
        <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffe9a8"/>
            <stop offset="1" stop-color="#f2cf6b"/>
        </linearGradient>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#605e5c"/>
        </marker>
        <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="108%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2d1b54" flood-opacity="0.10"/>
        </filter>
    </defs>

    <!-- bg -->
    <rect width="1200" height="640" fill="url(#bgGrad)"/>

    <!-- ===== Column labels ===== -->
    <text x="60"   y="46" font-size="11" font-weight="700" letter-spacing="2" fill="#4f29a3">DATA SOURCES</text>
    <text x="330"  y="46" font-size="11" font-weight="700" letter-spacing="2" fill="#4f29a3">CONNECT · BRONZE</text>
    <text x="600"  y="46" font-size="11" font-weight="700" letter-spacing="2" fill="#4f29a3">MICROSOFT FABRIC WORKSPACE</text>
    <text x="1035" y="46" font-size="11" font-weight="700" letter-spacing="2" fill="#4f29a3">SERVE</text>

    <!-- ===== Layer 1: SOURCES ===== -->
    <g filter="url(#cardShadow)">
        <!-- Azure SQL -->
        <rect x="60" y="105" width="200" height="80" rx="8" fill="#fff" stroke="#0078d4" stroke-width="2"/>
        <text x="80" y="132" font-size="13" font-weight="600" fill="#005a9e">🗄 Azure SQL</text>
        <text x="80" y="152" font-size="11" fill="#605e5c">Parcels · Assessments · Sales</text>
        <text x="80" y="170" font-size="11" fill="#605e5c">reference tables</text>

        <!-- Cosmos DB -->
        <rect x="60" y="215" width="200" height="80" rx="8" fill="#fff" stroke="#daa520" stroke-width="2"/>
        <text x="80" y="242" font-size="13" font-weight="600" fill="#8a6400">🌐 Cosmos DB</text>
        <text x="80" y="262" font-size="11" fill="#605e5c">Property profiles</text>
        <text x="80" y="280" font-size="11" fill="#605e5c">nested inspections[]</text>

        <!-- ADLS Gen2 -->
        <rect x="60" y="325" width="200" height="80" rx="8" fill="#fff" stroke="#7c52e6" stroke-width="2"/>
        <text x="80" y="352" font-size="13" font-weight="600" fill="#4f29a3">📁 ADLS Gen2</text>
        <text x="80" y="372" font-size="11" fill="#605e5c">Assessment appeals</text>
        <text x="80" y="390" font-size="11" fill="#605e5c">JSON + Parquet · narratives</text>
    </g>

    <!-- ===== Layer 2: CONNECT / BRONZE methods ===== -->
    <g filter="url(#cardShadow)">
        <rect x="330" y="112" width="200" height="66" rx="8" fill="#e1f3fa" stroke="#0078d4" stroke-width="1.5"/>
        <text x="430" y="140" font-size="12" font-weight="700" fill="#005a9e" text-anchor="middle">MIRROR</text>
        <text x="430" y="160" font-size="10" fill="#605e5c" text-anchor="middle">SQL → managed Delta (CDC)</text>

        <rect x="330" y="222" width="200" height="66" rx="8" fill="#e1f3fa" stroke="#0078d4" stroke-width="1.5"/>
        <text x="430" y="250" font-size="12" font-weight="700" fill="#005a9e" text-anchor="middle">MIRROR</text>
        <text x="430" y="270" font-size="10" fill="#605e5c" text-anchor="middle">Cosmos → Delta (change feed)</text>

        <rect x="330" y="332" width="200" height="66" rx="8" fill="#ede4fb" stroke="#7c52e6" stroke-width="1.5"/>
        <text x="430" y="360" font-size="12" font-weight="700" fill="#4f29a3" text-anchor="middle">SHORTCUT</text>
        <text x="430" y="380" font-size="10" fill="#605e5c" text-anchor="middle">appeals · zero-copy files</text>
    </g>

    <!-- Source -> method arrows -->
    <line x1="260" y1="145" x2="330" y2="145" stroke="#605e5c" marker-end="url(#arrow)"/>
    <line x1="260" y1="255" x2="330" y2="255" stroke="#605e5c" marker-end="url(#arrow)"/>
    <line x1="260" y1="365" x2="330" y2="365" stroke="#605e5c" marker-end="url(#arrow)"/>

    <!-- ===== Fabric workspace boundary ===== -->
    <rect x="560" y="70" width="450" height="500" rx="14" fill="none" stroke="#7c52e6" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="785" y="92" font-size="10" fill="#7c52e6" text-anchor="middle" letter-spacing="1">Sudsberry-lab · Fabric capacity</text>

    <!-- Bronze Lakehouse -->
    <g filter="url(#cardShadow)">
        <rect x="585" y="112" width="400" height="60" rx="10" fill="url(#bronzeGrad)" stroke="#a0541d" stroke-width="1.5"/>
        <text x="785" y="138" font-size="13" font-weight="700" fill="#7c4a03" text-anchor="middle">BronzeLakehouse</text>
        <text x="785" y="157" font-size="10" fill="#6b4d00" text-anchor="middle">SQL + Cosmos mirrors · appeals shortcut · one SQL endpoint</text>
    </g>

    <!-- method -> bronze arrows -->
    <line x1="530" y1="145" x2="585" y2="142" stroke="#605e5c" marker-end="url(#arrow)"/>
    <line x1="530" y1="255" x2="580" y2="165" stroke="#605e5c" marker-end="url(#arrow)"/>
    <line x1="530" y1="365" x2="580" y2="168" stroke="#605e5c" marker-end="url(#arrow)"/>

    <!-- Silver notebooks -->
    <g filter="url(#cardShadow)">
        <rect x="585" y="200" width="195" height="72" rx="10" fill="url(#silverGrad)" stroke="#5b6670" stroke-width="1.5"/>
        <text x="682" y="226" font-size="12" font-weight="700" fill="#33393f" text-anchor="middle">SILVER · Notebooks</text>
        <text x="682" y="245" font-size="10" fill="#605e5c" text-anchor="middle">conform · flatten</text>
        <text x="682" y="261" font-size="10" fill="#605e5c" text-anchor="middle">explode inspections</text>
    </g>

    <!-- AI on appeals -->
    <g filter="url(#cardShadow)">
        <rect x="795" y="200" width="190" height="72" rx="10" fill="#ede4fb" stroke="#7c52e6" stroke-width="1.5"/>
        <text x="890" y="226" font-size="12" font-weight="700" fill="#4f29a3" text-anchor="middle">AI ON APPEALS</text>
        <text x="890" y="245" font-size="10" fill="#605e5c" text-anchor="middle">ai.* sentiment · summary</text>
        <text x="890" y="261" font-size="10" fill="#605e5c" text-anchor="middle">classify · urgency · eval</text>
    </g>

    <!-- Gold marts -->
    <g filter="url(#cardShadow)">
        <rect x="585" y="300" width="400" height="76" rx="10" fill="url(#goldGrad)" stroke="#b7791f" stroke-width="1.5"/>
        <text x="785" y="325" font-size="13" font-weight="700" fill="#5c3d00" text-anchor="middle">GOLD · Business Marts</text>
        <text x="785" y="345" font-size="10" fill="#5c3d00" text-anchor="middle">property assessment · comparable sales</text>
        <text x="785" y="361" font-size="10" fill="#5c3d00" text-anchor="middle">appeal intelligence · neighbourhood equity</text>
    </g>

    <!-- Direct Lake semantic model -->
    <g filter="url(#cardShadow)">
        <rect x="585" y="404" width="195" height="72" rx="10" fill="#fff" stroke="#0078d4" stroke-width="2"/>
        <text x="682" y="430" font-size="12" font-weight="700" fill="#005a9e" text-anchor="middle">SEMANTIC MODEL</text>
        <text x="682" y="449" font-size="10" fill="#605e5c" text-anchor="middle">Direct Lake · star schema</text>
        <text x="682" y="465" font-size="10" fill="#605e5c" text-anchor="middle">over OneLake</text>
    </g>

    <!-- Power BI report -->
    <g filter="url(#cardShadow)">
        <rect x="795" y="404" width="190" height="72" rx="10" fill="#fff" stroke="#daa520" stroke-width="2"/>
        <text x="890" y="430" font-size="12" font-weight="700" fill="#8a6400" text-anchor="middle">POWER BI REPORT</text>
        <text x="890" y="449" font-size="10" fill="#605e5c" text-anchor="middle">valuations · sales ratios</text>
        <text x="890" y="465" font-size="10" fill="#605e5c" text-anchor="middle">appeals</text>
    </g>

    <!-- Fabric internal arrows -->
    <line x1="682" y1="172" x2="682" y2="200" stroke="#605e5c" marker-end="url(#arrow)"/>
    <line x1="780" y1="236" x2="795" y2="236" stroke="#605e5c" marker-end="url(#arrow)"/>
    <line x1="682" y1="272" x2="682" y2="300" stroke="#605e5c" marker-end="url(#arrow)"/>
    <line x1="890" y1="272" x2="850" y2="300" stroke="#605e5c" marker-end="url(#arrow)"/>
    <line x1="682" y1="376" x2="682" y2="404" stroke="#605e5c" marker-end="url(#arrow)"/>
    <line x1="850" y1="376" x2="890" y2="404" stroke="#605e5c" marker-end="url(#arrow)"/>

    <!-- ===== Serve column ===== -->
    <g filter="url(#cardShadow)">
        <rect x="1035" y="200" width="145" height="72" rx="10" fill="#fff" stroke="#7c52e6" stroke-width="2"/>
        <text x="1107" y="230" font-size="12" font-weight="700" fill="#4f29a3" text-anchor="middle">ONTOLOGY</text>
        <text x="1107" y="249" font-size="10" fill="#605e5c" text-anchor="middle">Parcel-anchored</text>
        <text x="1107" y="265" font-size="10" fill="#605e5c" text-anchor="middle">entity graph</text>
    </g>

    <g filter="url(#cardShadow)">
        <rect x="1035" y="300" width="145" height="88" rx="10" fill="url(#purpleGrad)"/>
        <text x="1107" y="332" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">DATA AGENT</text>
        <text x="1107" y="352" font-size="10" fill="#fff" fill-opacity="0.9" text-anchor="middle">grounded on Gold</text>
        <text x="1107" y="368" font-size="10" fill="#fff" fill-opacity="0.9" text-anchor="middle">safety guardrails</text>
    </g>

    <g filter="url(#cardShadow)">
        <rect x="1035" y="416" width="145" height="60" rx="10" fill="#fff" stroke="#605e5c" stroke-width="1.5"/>
        <text x="1107" y="442" font-size="11" font-weight="600" fill="#1f1f1f" text-anchor="middle">Grounded answer</text>
        <text x="1107" y="460" font-size="10" fill="#605e5c" text-anchor="middle">plain language</text>
    </g>

    <!-- Gold -> serve arrows -->
    <line x1="985" y1="330" x2="1035" y2="336" stroke="#605e5c" marker-end="url(#arrow)"/>
    <line x1="985" y1="338" x2="1035" y2="236" stroke="#605e5c" marker-end="url(#arrow)"/>
    <line x1="1107" y1="272" x2="1107" y2="300" stroke="#605e5c" marker-end="url(#arrow)"/>
    <line x1="1107" y1="388" x2="1107" y2="416" stroke="#605e5c" marker-end="url(#arrow)"/>

    <!-- ===== Bottom stage pills ===== -->
    <g font-size="10" font-weight="700" letter-spacing="1" fill="#4f29a3" text-anchor="middle">
        <text x="160" y="600">SOURCES</text>
        <rect x="80" y="612" width="160" height="26" rx="13" fill="#fff" stroke="#7c52e6"/>
        <text x="160" y="629" fill="#4f29a3">GET STARTED</text>

        <text x="430" y="600">CONNECT</text>
        <rect x="350" y="612" width="160" height="26" rx="13" fill="#fff" stroke="#7c52e6"/>
        <text x="430" y="629" fill="#4f29a3">GOAL 1</text>

        <text x="785" y="600">FABRIC PLATFORM</text>
        <rect x="705" y="612" width="160" height="26" rx="13" fill="#fff" stroke="#7c52e6"/>
        <text x="785" y="629" fill="#4f29a3">GOALS 2–4</text>

        <text x="1107" y="600">SERVE</text>
        <rect x="1027" y="612" width="160" height="26" rx="13" fill="#fff" stroke="#7c52e6"/>
        <text x="1107" y="629" fill="#4f29a3">GOAL 4</text>
    </g>
</svg>
